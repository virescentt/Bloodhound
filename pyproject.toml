[project]
name = "slad-fejka"
version = "0.1.0"
description = "Ślad Fejka — od pojedynczych reklam do kampanii oszustw (HackNation 2026, NASK: Kolekcjoner Fejków)"
requires-python = ">=3.13"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# UP042: enumy (str, Enum) w slad/models.py to kontrakt — StrEnum zmieniłby str()/format() wartości
ignore = ["E501", "UP042"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
