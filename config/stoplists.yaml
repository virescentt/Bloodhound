# Bloodhound — listy wyjątków: wartości wskaźników ZBYT CZĘSTE, by świadczyły o wspólnej kampanii.
#
# Moduł powiązań (slad/link) usuwa je z przesłanek albo mocno osłabia. Dwa materiały, które ładują jQuery
# z jsDelivr, stoją za Cloudflare albo mają certyfikat Let's Encrypt, NIE są przez to powiązane — to tło
# internetu, nie ślad operatora. Ważenie rzadkością (link.rarity) obniża wagę wartości częstych w zbiorze;
# te listy działają także wtedy, gdy zbiór jest mały i statystyki częstości nic jeszcze nie mówią.
#
# Zasady dopasowania (małe litery, bez spacji na końcach):
#   domains              — domena lub host: równość albo subdomena (cdn.jsdelivr.net pasuje do jsdelivr.net).
#                          Dotyczy domen łańcucha, skryptów, linków wychodzących i formularzy. Skracacze linków
#                          (bit.ly, t.co…) są tu, bo nie są śladem operatora — moduł infrastruktury i tak przechodzi
#                          przez nie do strony docelowej.
#   asns                 — numer systemu autonomicznego (porównuj sam numer „AS13335”, bez nazwy).
#   nameserver_patterns  — wzorce fnmatch nazw serwerów DNS (np. „*.ns.cloudflare.com”, „*.awsdns-*”).
#   registrars           — fragment nazwy rejestratora (dopasowanie po podciągu). Sam rejestrator nie jest
#                          przesłanką; razem z bliską datą rejestracji (±3 dni) — co najwyżej słabą.
#   tls_issuers          — fragment nazwy wystawcy certyfikatu. Wystawca sam w sobie NIGDY nie jest przesłanką
#                          (przesłanką jest odcisk certyfikatu albo wspólne nazwy SAN).
#   form_fields          — standardowe nazwy pól formularzy (imię, e-mail, telefon…). Przesłanką jest dopiero
#                          nietypowy zestaw pól albo pola ukryte z identyfikatorem oferty/strumienia.
# Uwaga: identyfikatory „tracker:keitaro”, „tracker:binom” itp. w tracker_ids oznaczają RODZAJ oprogramowania
# trackera kliknięć (wiele kampanii go używa), a nie identyfikator operatora — należy traktować je jak słabą przesłankę.

