# Osoby publiczne, których wizerunek i nazwisko najczęściej wykorzystują polskie reklamy oszustw
# (fałszywe artykuły i „wywiady”, deepfake wideo, „programy rządowe”) — na podstawie publicznych ostrzeżeń
# CERT Polska / NASK i doniesień medialnych 2023–2026.
# SŁOWNIK DETEKCJI: obecność nazwiska w materiale oznacza PODSZYWANIE SIĘ pod tę osobę, nie jej udział w oszustwie.
#
# Format:  - name: nazwa kanoniczna (wynik w TextFeatures.persons)
#            aliases: [inne zapisy: samo nazwisko, wersja bez polskich znaków, nietypowa odmiana, funkcja]
# Dopasowanie (slad/features/text.py): bez rozróżniania wielkości liter i polskich znaków, na granicach słów,
# z typowymi końcówkami fleksyjnymi (Lewandowskiego, Brzoską, Tuska, Ibiszem…); aliasy wielowyrazowe tolerują
# drobne błędy OCR. Samo nazwisko jest aliasem tylko wtedy, gdy jest jednoznaczne (nie „Duda”, „Prokop”, „Pazura”).
# Wyniki LLM są sprowadzane do tych nazw kanonicznych.

