# Marki, media, banki, firmy i instytucje najczęściej podszywane w polskich reklamach oszustw (fałszywe artykuły
# „TVN24 / Onet / Business Insider”, „inwestycje Orlen / Baltic Pipe”, „dopłata InPost / Poczta Polska”,
# „blokada konta PKO BP”, „program rządowy gov.pl”…) — na podstawie publicznych ostrzeżeń CERT Polska / NASK.
# SŁOWNIK DETEKCJI: wystąpienie marki oznacza podszywanie się pod nią, nie jej udział w oszustwie.
#
# Format:  - name: nazwa kanoniczna (wynik w TextFeatures.brands)
#            aliases: [inne zapisy: pełna nazwa, domena, odmiana]
#            match_name: false   (opcjonalnie) — sama nazwa nie jest dopasowywana, gdy to zwykłe słowo („Fakt”)
# Dopasowanie jak w persons.yaml (bez wielkości liter i polskich znaków, z końcówkami: Orlenu, InPostem…).
# WYJĄTEK: skróty z 2–3 wielkich liter (PKO, ING, ZUS, NBP…) są dopasowywane z rozróżnieniem wielkości liter,
# żeby „ing” czy „wp” w zwykłym tekście nie dawały trafień — dlatego obok skrótu warto podać domenę lub pełną nazwę.

