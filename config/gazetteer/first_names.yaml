# Popularne polskie imiona (mianownik) — heurystyka „imię + nazwisko” dla osób SPOZA słownika persons.yaml
# (slad/features/text.py: find_person_names). Szuka wyłącznie w treści reklamy (tekst wejścia + OCR),
# nie na stronie docelowej (fałszywe „opinie klientów” to nie podszywanie się pod osobę publiczną).
# Formy odmiany (Marka, Markiem, Joanny, Joanną…) i nazwiska przymiotnikowe (Zawadzkiego → Zawadzki)
# są sprowadzane do mianownika regułami. Imiona dwuznaczne (Maja, Róża, Wiktoria…) celowo pominięte.

