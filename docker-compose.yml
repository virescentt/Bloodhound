# Ślad Fejka — uruchomienie w Dockerze (CPU, bez GPU). Zbiory danych kładziemy w ./data, wyniki trafiają
# do ./workspace (oba katalogi poza obrazem i poza repozytorium).
#
#   docker compose up --build app                          interfejs: http://localhost:8501
#   docker compose run --rm demo                           demo: zbiór syntetyczny → przetwarzanie → ewaluacja
#   SLAD_WORKSPACE=workspace/demo docker compose up app    interfejs z wynikami demo
#   DATASET=data/nask docker compose run --rm pipeline     przetworzenie zbioru z ./data → ./workspace/default
#   docker compose run --rm app python -m slad --help      dowolna komenda CLI
#   WITH_CLIP=1 docker compose build                       opcjonalnie z CLIP (requirements-extra.txt)
#
# Klucz LLM i inne ustawienia: plik .env (kopia .env.example) — przekazywany do kontenera, nie do obrazu.

x-app: &app
  build:
    context: .
    args:
      WITH_CLIP: ${WITH_CLIP:-0}
  image: slad-fejka:latest
  env_file:
    - path: .env
      required: false
  environment:
    SLAD_WORKSPACE: ${SLAD_WORKSPACE:-workspace/default}
  volumes:
    - ./data:/app/data
    - ./workspace:/app/workspace
    - ./config:/app/config            # wagi i progi edytowalne bez przebudowy obrazu
    - ./reference:/app/reference      # baza twarzy reference/faces/<Imię_Nazwisko>/*.jpg (tylko lokalnie)

services:
  app:
    <<: *app
    command: ["python", "-m", "slad", "ui", "--host", "0.0.0.0", "--port", "8501", "--no-browser"]
    ports:
      - "8501:8501"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3

  # jednorazowe przetworzenie zbioru (profil „cli” — nie startuje przy samym `docker compose up`)
  pipeline:
    <<: *app
    profiles: ["cli"]
    command: ["python", "-m", "slad", "run", "${DATASET:-data/nask}"]

  demo:
    <<: *app
    profiles: ["cli"]
    command: ["python", "-m", "slad", "demo"]
